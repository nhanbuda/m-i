<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocabulary Practice - Part B</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background-color: #1e293b; width: 100%; max-width: 900px; border-radius: 16px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 2px solid #334155; padding-bottom: 16px; }
    .title { font-size: 24px; font-weight: bold; color: #38bdf8; }
    .progress { font-size: 16px; color: #94a3b8; font-weight: 600; }
    .question { font-size: 22px; line-height: 1.5; margin-bottom: 28px; color: #f1f5f9; font-weight: 500; }
    .options { display: flex; flex-direction: column; gap: 16px; margin-bottom: 28px; }
    .option-btn { background-color: #334155; color: #f8fafc; border: 2px solid transparent; padding: 18px 24px; border-radius: 12px; font-size: 18px; text-align: left; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; }
    .option-btn:hover { background-color: #475569; transform: translateY(-2px); }
    .option-btn.correct { background-color: #15803d; border-color: #22c55e; color: #ffffff; font-weight: bold; }
    .option-btn.wrong { background-color: #b91c1c; border-color: #ef4444; color: #ffffff; }
    .feedback { font-size: 18px; font-weight: 600; padding: 16px; border-radius: 8px; margin-bottom: 24px; display: none; text-align: center; }
    .feedback.correct { display: block; background-color: #166534; color: #4ade80; }
    .feedback.wrong { display: block; background-color: #991b1b; color: #fca5a5; }
    .controls { display: flex; justify-content: space-between; }
    .nav-btn { background-color: #0284c7; color: white; border: none; padding: 12px 28px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .nav-btn:hover { background-color: #0369a1; }
    .nav-btn:disabled { background-color: #475569; cursor: not-allowed; opacity: 0.5; }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="title">PART B: VOCABULARY PRACTICE</div>
    <div class="progress" id="progress">Câu 1 / 10</div>
  </div>

  <div class="question" id="question-text">Loading...</div>

  <div class="options" id="options-container"></div>

  <div class="feedback" id="feedback"></div>

  <div class="controls">
    <button class="nav-btn" id="prev-btn" onclick="changeQuestion(-1)">← Câu trước</button>
    <button class="nav-btn" id="next-btn" onclick="changeQuestion(1)">Câu tiếp →</button>
  </div>
</div>

<script>
  const questions = [
    {
      q: "1. When you <b>distinguish</b> yourself from other people, you ________.",
      options: [
        { text: "a. try to copy other people", correct: false },
        { text: "b. show that you are different", correct: true }
      ]
    },
    {
      q: "2. A synonym for <b>absence</b> is ________.",
      options: [
        { text: "a. lack", correct: true },
        { text: "b. large amount", correct: false }
      ]
    },
    {
      q: "3. A person who is <b>committed</b> to an idea ________.",
      options: [
        { text: "a. came up with the idea", correct: false },
        { text: "b. believes strongly in it", correct: true }
      ]
    },
    {
      q: "4. An <b>element</b> is a(n) ________.",
      options: [
        { text: "a. part of something", correct: true },
        { text: "b. effective way of doing something", correct: false }
      ]
    },
    {
      q: "5. The <b>function</b> of a product means ________.",
      options: [
        { text: "a. how it is used", correct: true },
        { text: "b. what it looks like", correct: false }
      ]
    },
    {
      q: "6. A <b>concept</b> is a(n) ________.",
      options: [
        { text: "a. idea", correct: true },
        { text: "b. process", correct: false }
      ]
    },
    {
      q: "7. A person's <b>philosophy</b> about something is ________.",
      options: [
        { text: "a. their specific goal", correct: false },
        { text: "b. their set of beliefs", correct: true }
      ]
    },
    {
      q: "8. A <b>material</b> is a substance ________.",
      options: [
        { text: "a. such as metal and stone", correct: true },
        { text: "b. that is made by hand", correct: false }
      ]
    },
    {
      q: "9. A style of architecture might <b>date from</b> ________.",
      options: [
        { text: "a. a particular place", correct: false },
        { text: "b. a time in history", correct: true }
      ]
    },
    {
      q: "10. If you are <b>unfamiliar</b> with something, you ________.",
      options: [
        { text: "a. know a lot about it", correct: false },
        { text: "b. know little or nothing about it", correct: true }
      ]
    }
  ];

  let currentIndex = 0;
  let selectedAnswers = {};

  function renderQuestion() {
    const qData = questions[currentIndex];
    document.getElementById('progress').innerText = `Câu ${currentIndex + 1} / ${questions.length}`;
    document.getElementById('question-text').innerHTML = qData.q;
    
    const container = document.getElementById('options-container');
    container.innerHTML = '';
    
    const feedback = document.getElementById('feedback');
    feedback.className = 'feedback';
    feedback.style.display = 'none';

    qData.options.forEach((opt, idx) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt.text;

      if (selectedAnswers[currentIndex] !== undefined) {
        if (selectedAnswers[currentIndex] === idx) {
          if (opt.correct) {
            btn.classList.add('correct');
            btn.innerText += ' ✓';
          } else {
            btn.classList.add('wrong');
            btn.innerText += ' ✕';
          }
        } else if (opt.correct) {
          btn.classList.add('correct');
          btn.innerText += ' ✓';
        }
      }

      btn.onclick = () => selectOption(idx, opt.correct);
      container.appendChild(btn);
    });

    document.getElementById('prev-btn').disabled = currentIndex === 0;
    document.getElementById('next-btn').disabled = currentIndex === questions.length - 1;
  }

  function selectOption(idx, isCorrect) {
    selectedAnswers[currentIndex] = idx;
    renderQuestion();

    const feedback = document.getElementById('feedback');
    if (isCorrect) {
      feedback.innerText = ' Chính xác!';
      feedback.className = 'feedback correct';
    } else {
      feedback.innerText = ' Rất tiếc, thử lại nhé!';
      feedback.className = 'feedback wrong';
    }
    feedback.style.display = 'block';
  }

  function changeQuestion(step) {
    currentIndex += step;
    renderQuestion();
  }

  renderQuestion();
</script>

</body>
</html>
